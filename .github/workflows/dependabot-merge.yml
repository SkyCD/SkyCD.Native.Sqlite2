name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: ['Build, test and publish NuGet']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # No checkout: this privileged job never executes code from an update PR.
      - name: Merge only the tested Dependabot commit and build main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for number in $(jq -r '.workflow_run.pull_requests[].number' "$GITHUB_EVENT_PATH"); do
            pr=$(gh api "repos/$GH_REPO/pulls/$number")
            if ! jq -e --arg repo "$GH_REPO" --arg sha "$TESTED_SHA" '
              .user.login == "dependabot[bot]" and .state == "open" and
              .draft == false and .base.ref == "main" and
              .head.repo.full_name == $repo and .head.sha == $sha
            ' <<< "$pr" > /dev/null; then
              continue
            fi
            gh pr merge "$number" --repo "$GH_REPO" --squash --match-head-commit "$TESTED_SHA"
            # GITHUB_TOKEN merges do not emit another push workflow; dispatch it explicitly.
            gh workflow run ci.yml --repo "$GH_REPO" --ref main -f channel=preview
          done
