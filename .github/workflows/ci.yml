name: Build, test and publish NuGet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 16 3,7,11 *'

permissions:
  contents: read

concurrency:
  group: sqlite2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TOOL: tools/SkyCD.Native.Sqlite2.Build

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      frameworks: ${{ steps.releases.outputs.frameworks }}
      latest: ${{ steps.releases.outputs.latest }}
      unreleased: ${{ steps.releases.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Discover all stable .NET releases from 8 onward
        id: releases
        run: dotnet run --project "$BUILD_TOOL" -c Release -- release-matrix --output "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: github.event_name != 'schedule' || needs.discover.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            ${{ needs.discover.outputs.latest }}
      - name: CI package version
        id: version
        run: echo "value=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig compiler
        run: |
          curl -L --fail --silent --show-error https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Generate README from template and build native assets
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          LIBRARY_FRAMEWORKS: ${{ needs.discover.outputs.frameworks }}
        run: |
          dotnet run --project "$BUILD_TOOL" -c Release -- generate-readme --version "$PACKAGE_VERSION" --frameworks "$LIBRARY_FRAMEWORKS"
          dotnet run --project "$BUILD_TOOL" -c Release --no-build -- native-build --zig zig
      - name: Restore, format, build and pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          LibraryTargetFrameworks: ${{ needs.discover.outputs.frameworks }}
        run: |
          dotnet restore SkyCD.Native.Sqlite2.slnx
          dotnet format SkyCD.Native.Sqlite2.slnx --verify-no-changes --verbosity minimal
          dotnet build SkyCD.Native.Sqlite2.slnx -c Release --no-restore -warnaserror
          dotnet pack src/SkyCD.Native.Sqlite2 -c Release --no-build -p:PackageVersion="$PACKAGE_VERSION" -o artifacts/nuget
          for package in artifacts/nuget/*.nupkg; do
            dotnet run --project "$BUILD_TOOL" -c Release --no-build -- verify-package --package "$package"
          done
          dotnet run --project "$BUILD_TOOL" -c Release --no-build -- check-licenses --sbom native-sbom.json --policy dependency-license-policy.json --report artifacts/native-license-report.json
          if [ -n "$(git ls-files '*.zip' '*.ps1')" ]; then
            echo "Source ZIPs and PowerShell helpers must not be tracked."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-assets
          path: src/SkyCD.Native.Sqlite2/native/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: generated-readme
          path: README.md

  test:
    needs: [discover, build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            ${{ matrix.sdk }}
      - uses: actions/download-artifact@v8
        with:
          name: native-assets
          path: src/SkyCD.Native.Sqlite2/native
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Native wrapper tests
        shell: bash
        run: dotnet test SkyCD.Native.Sqlite2.slnx -c Release --blame-hang-timeout 60s
      - name: Consume the actual RID-published NuGet package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          TEST_RID: ${{ matrix.rid }}
          TEST_FRAMEWORK: ${{ matrix.framework }}
        run: dotnet run --project "$BUILD_TOOL" -c Release --no-build -- smoke-package --version "$PACKAGE_VERSION" --rid "$TEST_RID" --framework "$TEST_FRAMEWORK" --feed artifacts/nuget

  required-checks:
    name: Required checks
    if: always()
    needs: [discover, build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require build, licenses and every matrix test to pass
        env:
          DISCOVERY: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.test.result }}
          EVENT: ${{ github.event_name }}
          UNRELEASED: ${{ needs.discover.outputs.unreleased }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$UNRELEASED" = false ] && [ "$DISCOVERY" = success ]; then exit 0; fi
          test "$DISCOVERY" = success && test "$BUILD" = success && test "$TESTS" = success

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, test, required-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts/nuget
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish library to SkyCD GitHub Packages
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push 'artifacts/nuget/SkyCD.Native.Sqlite2.*.nupkg' --source https://nuget.pkg.github.com/SkyCD/index.json --api-key "$PACKAGE_TOKEN" --skip-duplicate

  readme:
    if: github.ref == 'refs/heads/main'
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: generated-readme
          path: .
      - name: Open a generated README update PR
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- README.md; then
            git tag "v${PACKAGE_VERSION}"
            git push origin "v${PACKAGE_VERSION}"
            exit 0
          fi
          branch="automation/readme-${PACKAGE_VERSION}"
          git switch -c "$branch"
          git add README.md
          git commit -m '[489] Update generated README' -m 'Co-authored-by: OpenAI Codex <codex@openai.com>'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title '[489] Update generated README' --body 'Refresh the generated README for the published package. This PR is verified against the trusted template before automatic merge.'
          gh workflow run readme-update.yml --ref main -f branch="$branch" -f version="$PACKAGE_VERSION" -f run-id="${{ github.run_id }}"
