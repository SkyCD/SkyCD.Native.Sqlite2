name: Verify generated README update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Generated README branch
        required: true
      version:
        description: Published package version
        required: true
      run-id:
        description: Successful publishing build
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Required checks
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.verify.outputs.number }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # Only execute trusted tooling from main, never code from the update branch.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify the generated document against the published build
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PUBLISH_RUN_ID: ${{ inputs.run-id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^0\.1\.0-ci\.[0-9]+$ ]]
          test "$UPDATE_BRANCH" = "automation/readme-${PACKAGE_VERSION}"
          number=$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number')
          pr=$(gh api "repos/$GH_REPO/pulls/$number")
          jq -e --arg branch "$UPDATE_BRANCH" --arg repo "$GH_REPO" '.user.login == "github-actions[bot]" and .base.ref == "main" and .head.ref == $branch and .head.repo.full_name == $repo' <<< "$pr" > /dev/null
          files=$(gh api "repos/$GH_REPO/pulls/$number/files")
          jq -e 'length == 1 and .[0].filename == "README.md"' <<< "$files" > /dev/null
          sha=$(jq -r '.head.sha' <<< "$pr")
          # Verify byte-for-byte against the README artifact of the successful publishing run.
          run_number="${PACKAGE_VERSION##*.}"
          [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$PUBLISH_RUN_ID")
          jq -e --argjson number "$run_number" '.run_number == $number and .head_branch == "main" and .event != "pull_request" and .path == ".github/workflows/ci.yml"' <<< "$run" > /dev/null
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$PUBLISH_RUN_ID/jobs?per_page=100")
          jq -e '[.jobs[] | select(.name == "publish" or .name == "Required checks") | .conclusion] == ["success", "success"]' <<< "$jobs" > /dev/null
          gh run download "$PUBLISH_RUN_ID" --name generated-readme --dir expected
          gh api "repos/$GH_REPO/contents/README.md?ref=$sha" --jq .content | base64 --decode > actual.md
          cmp expected/README.md actual.md
          # Attach the required result to the PR's commit, rather than the dispatch's main commit.
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Record verification, merge the README PR and tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.verify.outputs.number }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/check-runs" -f name='Required checks' -f head_sha="$VERIFIED_SHA" -f status=completed -f conclusion=success --silent
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$VERIFIED_SHA"
          merged_sha=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .merge_commit_sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v${PACKAGE_VERSION}" -f sha="$merged_sha" --silent
